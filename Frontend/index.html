<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Primary SEO -->
    <title>
      HIACDI | Humanity, Inclusion and Advancement Community Development Initiative
    </title>

    <meta
      name="description"
      content="HIACDI (Humanity, Inclusion and Advancement Community Development Initiative) advances health, education, youth empowerment, gender equality, protection, inclusion and sustainable community development."
    />

    <meta
      name="keywords"
      content="HIACDI, Humanity Inclusion and Advancement Community Development Initiative, community development Kenya, CBO Kenya, NGO Kenya, health, education, youth empowerment, GBV, FGM, gender equality, child protection, disability inclusion, community development"
    />

    <meta
      name="author"
      content="Humanity, Inclusion and Advancement Community Development Initiative"
    />

    <!-- Search Engine Instructions -->
    <meta name="robots" content="index, follow" />

    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="bingbot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta name="theme-color" content="#ffffff" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://hiacdi.org/" />

    <!-- Favicon / HIACDI Logo -->
    <link
      rel="icon"
      type="image/png"
      href="/brand/logo-mark.png?v=3"
    />

    <link
      rel="apple-touch-icon"
      href="/brand/logo-mark.png"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta
      property="og:site_name"
      content="HIACDI"
    />

    <meta
      property="og:locale"
      content="en_KE"
    />

    <meta
      property="og:url"
      content="https://hiacdi.org/"
    />

    <meta
      property="og:title"
      content="HIACDI | Humanity, Inclusion and Advancement Community Development Initiative"
    />

    <meta
      property="og:description"
      content="HIACDI advances health, education, youth empowerment, gender equality, protection, inclusion and sustainable community development."
    />

    <meta
      property="og:image"
      content="https://hiacdi.org/brand/logo-mark.png"
    />

    <meta
      property="og:image:alt"
      content="HIACDI - Humanity, Inclusion and Advancement Community Development Initiative logo"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="HIACDI | Humanity, Inclusion and Advancement Community Development Initiative"
    />

    <meta
      name="twitter:description"
      content="HIACDI advances health, education, youth empowerment, gender equality, protection, inclusion and sustainable community development."
    />

    <meta
      name="twitter:image"
      content="https://hiacdi.org/brand/logo-mark.png"
    />

    <meta
      name="twitter:image:alt"
      content="HIACDI - Humanity, Inclusion and Advancement Community Development Initiative logo"
    />

    <!--
      Google WebSite Structured Data
      Helps Google understand that the preferred site name is HIACDI.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "HIACDI",
        "alternateName": [
          "Humanity, Inclusion and Advancement Community Development Initiative",
          "Humanity, Inclusion and Advancement"
        ],
        "url": "https://hiacdi.org/"
      }
    </script>

    <!--
      Google Organization Structured Data
      Connects HIACDI's official name, website and logo.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "HIACDI",
        "legalName": "Humanity, Inclusion and Advancement Community Development Initiative",
        "alternateName": "Humanity, Inclusion and Advancement Community Development Initiative",
        "url": "https://hiacdi.org/",
        "logo": {
          "@type": "ImageObject",
          "url": "https://hiacdi.org/brand/logo-mark.png",
          "width": 512,
          "height": 512
        },
        "sameAs": [
          "https://x.com/HIACDI",
          "https://www.facebook.com/share/1KfUdL2kbr/",
          "https://www.tiktok.com/@hiacdiorg",
          "https://www.youtube.com/channel/UC9bwO2xfRow8gTLgV5L-rKA",
          "https://www.linkedin.com/in/hiacdi-tech-hub-94a33043b/"
        ]
      }
    </script>

    <!-- Google Fonts -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
